<link rel="stylesheet" href="{{ base_path }}/static/css/font-awesome.min.css?v={{version}}">
<link rel="stylesheet" href="{{ base_path }}/static/css/general.css?v={{version}}">
<link rel="stylesheet" href="{{ base_path }}/static/css/dark_theme.css?v={{version}}" class="alternate" {% if not config.dark_theme %} disabled="true" {% endif %}>
<link rel="stylesheet" href="{{ base_path }}/static/css/light_theme.css?v={{version}}" class="alternate" {% if config.dark_theme %} disabled="true" {% endif %}>
{% if config.dont_invert_images %}
<style>
    img:not(.favicon) {
        filter: none !important;
    }
</style>
{% endif %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/static/images/apple-touch-icon.png"> <link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/static/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ base_path }}/static/images/favicon-16x16.png">
<link rel="manifest" href="{{ base_path }}/static/images/site.webmanifest">
<script type="text/javascript">
    var scrollPosition = 0;
    var bodyDiv = null;
    var offsetNotScroll = null;
    var darkTheme = getJinjaBool('{{ config.dark_theme }}');
    var zoom = {{ config.zoom }};
    var zoomStep = 0.1;

    // Pagination state (article view only, see initPagination)
    var paginated = false;
    var currentPage = 0;
    var pageCount = 1;

    window.onpageshow = function(event) {
        if (sessionStorage.getItem("refresh")) {
          sessionStorage.removeItem("refresh");
          location.reload();
        }
    };

    function getJinjaBool(value) {
        return value == 'True';
    }

    window.onload = function onLoad() {
        bodyDiv = document.getElementById("body");
        offsetNotScroll = Math.round(bodyDiv.offsetHeight * 0.1);
        paginated = bodyDiv.classList.contains("paginated");

        let headerElement = document.getElementById("header");
        let headerHeight = headerElement ? headerElement.offsetHeight : 0;
        bodyDiv.style.height = `calc(100vh - ${headerHeight}px - 20px)`;

        let toolbarWidth = document.getElementById("toolbar").offsetWidth;
        bodyDiv.style.maxWidth = `calc(100vw - ${toolbarWidth}px)`;

        bodyDiv.style.zoom = zoom;
        darkTheme = getJinjaBool('{{ config.dark_theme }}');
        updateZoomValue();

        if (paginated) {
            initPagination();
        }
    }

    function removeGhostLettersInit() {
        if (darkTheme) {
            document.getElementById("body").classList.add("all-white");
        }
    }

    function removeGhostLettersFinish() {
        setTimeout(function() {
            if (darkTheme) {
                document.getElementById("body").classList.remove("all-white");
            }
        }, 10);
    }

    // ---------------------------------------------------------------------
    // Pagination
    //
    // A paginated #body (articles and lists) is a multi-column box with a
    // fixed height and one column per "page" (see .paginated in general.css).
    // Pages are laid out horizontally; page N starts at scrollLeft =
    // N * clientWidth because the column gap equals the horizontal padding.
    // ---------------------------------------------------------------------
    var IMAGE_MAX_PAGE_FRACTION = 0.5;

    function initPagination() {
        currentPage = loadSavedPage();
        layoutPages();
        bodyDiv.addEventListener("click", onPageTap);

        // Images that finish loading after onload change the layout.
        bodyDiv.querySelectorAll("img").forEach(function (img) {
            if (!img.complete) {
                img.addEventListener("load", relayoutKeepingPosition);
            }
        });

        window.addEventListener("resize", relayoutKeepingPosition);
    }

    // Measures the content and recomputes the page count. Must be called
    // whenever the box size or zoom changes.
    function layoutPages() {
        // Images take at most half a page (aspect ratio kept by CSS).
        let style = window.getComputedStyle(bodyDiv);
        let innerHeight = bodyDiv.clientHeight
            - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        bodyDiv.querySelectorAll("img:not(.favicon), video").forEach(function (el) {
            el.style.maxHeight = Math.floor(innerHeight * IMAGE_MAX_PAGE_FRACTION) + "px";
        });

        let pageWidth = bodyDiv.clientWidth;
        pageCount = Math.max(1, Math.ceil((bodyDiv.scrollWidth - 1) / pageWidth));
        showPage(currentPage);
    }

    function relayoutKeepingPosition() {
        let ratio = pageCount > 1 ? currentPage / (pageCount - 1) : 0;
        layoutPages();
        showPage(Math.round(ratio * (pageCount - 1)));
    }

    function showPage(page) {
        currentPage = Math.max(0, Math.min(page, pageCount - 1));
        removeGhostLettersInit();
        bodyDiv.scrollLeft = currentPage * bodyDiv.clientWidth;
        removeGhostLettersFinish();
        updatePageIndicator();
        savePage();
    }

    // Remember the page per URL for this browser session, so coming back
    // to a list (or re-opening an article) lands where you left off.
    function savePage() {
        try {
            sessionStorage.setItem("page:" + location.pathname, String(currentPage));
        } catch (e) {}
    }

    function loadSavedPage() {
        try {
            return parseInt(sessionStorage.getItem("page:" + location.pathname), 10) || 0;
        } catch (e) {
            return 0;
        }
    }

    function updatePageIndicator() {
        let indicator = document.getElementById("pageIndicator");
        if (indicator) {
            indicator.textContent = (currentPage + 1) + "/" + pageCount;
        }
    }

    // Taps on a paginated view:
    //   - links keep working as links
    //   - an image opens it full screen
    //   - left half goes to the previous page, right half to the next one
    function onPageTap(event) {
        let target = event.target;
        if (target.closest && target.closest("a")) {
            return;
        }
        let selection = window.getSelection ? window.getSelection() : null;
        if (selection && selection.toString().length > 0) {
            return;
        }
        if (target.tagName === "IMG" && !target.classList.contains("favicon")) {
            openImageViewer(target);
            return;
        }
        let rect = bodyDiv.getBoundingClientRect();
        if (event.clientX < rect.left + rect.width / 2) {
            prevPage();
        } else {
            nextPage();
        }
    }

    function nextPage() { showPage(currentPage + 1); }
    function prevPage() { showPage(currentPage - 1); }

    // Full screen image viewer: tap the image to open, tap anywhere to close.
    function openImageViewer(img) {
        let viewer = document.getElementById("imageViewer");
        if (!viewer) {
            viewer = document.createElement("div");
            viewer.id = "imageViewer";
            viewer.className = "image-viewer";
            viewer.appendChild(document.createElement("img"));
            viewer.addEventListener("click", closeImageViewer);
            document.body.appendChild(viewer);
        }
        let big = viewer.firstChild;
        big.onload = function () { sizeViewerImage(big); };
        big.src = img.currentSrc || img.src;
        big.alt = img.alt || "";
        viewer.style.display = "flex";
        if (big.complete) {
            sizeViewerImage(big);
        }
    }

    // Scale the image (up or down) to the largest size that fits the screen,
    // keeping its aspect ratio. Done in JS because older e-reader browsers
    // don't support object-fit.
    function sizeViewerImage(img) {
        if (!img.naturalWidth || !img.naturalHeight) {
            return;
        }
        let scale = Math.min(window.innerWidth / img.naturalWidth, window.innerHeight / img.naturalHeight);
        img.style.width = Math.floor(img.naturalWidth * scale) + "px";
        img.style.height = Math.floor(img.naturalHeight * scale) + "px";
    }

    function closeImageViewer() {
        let viewer = document.getElementById("imageViewer");
        if (viewer) {
            viewer.style.display = "none";
        }
    }

    // ---------------------------------------------------------------------
    // Toolbar navigation. On paginated views (articles, feed list, article
    // list) these move by pages; any other view scrolls vertically.
    // ---------------------------------------------------------------------
    function scrollDown() {
        if (paginated) { return nextPage(); }
        removeGhostLettersInit();
        scrollPosition = Math.min(scrollPosition + bodyDiv.offsetHeight - offsetNotScroll, bodyDiv.scrollHeight);
        bodyDiv.scroll(0, scrollPosition);
        removeGhostLettersFinish();
    }

    function scrollUp() {
        if (paginated) { return prevPage(); }
        removeGhostLettersInit();
        scrollPosition = Math.max(scrollPosition - bodyDiv.offsetHeight + offsetNotScroll, 0);
        bodyDiv.scroll(0, scrollPosition);
        removeGhostLettersFinish();
    }

    function scrollToTop() {
        if (paginated) { return showPage(0); }
        removeGhostLettersInit();
        scrollPosition = 0;
        bodyDiv.scroll(0, scrollPosition);
        removeGhostLettersFinish();
    }

    function scrollToBottom() {
        if (paginated) { return showPage(pageCount - 1); }
        removeGhostLettersInit();
        scrollPosition = bodyDiv.scrollHeight - bodyDiv.offsetHeight;
        bodyDiv.scroll(0, scrollPosition);
        removeGhostLettersFinish();
    }

    function setZoomConfig(zoom) {
        fetch("{{ base_path }}/config/zoom", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ zoom })
        });
    }

    function updateZoomValue() {
        let zoomInput = document.getElementById("zoom-input");
        if (zoomInput) {
            zoomInput.value = Math.round(zoom * 100) + "%";
        }
    }

    function zoomIn() {
        zoom += zoomStep;
        bodyDiv.style.zoom = zoom;
        if (paginated) { relayoutKeepingPosition(); }

        setZoomConfig(zoom);
        updateZoomValue();
    }

    function zoomOut() {
        zoom -= zoomStep;
        bodyDiv.style.zoom = zoom;
        if (paginated) { relayoutKeepingPosition(); }

        setZoomConfig(zoom);
        updateZoomValue();
    }

    function toggleTheme() {
        document
          .querySelectorAll('link[rel=stylesheet].alternate')
          .forEach(function (node) { node.disabled = !node.disabled; });

        let toggleThemeButton = document.getElementById("toggleThemeButton");

        if (darkTheme) {
            toggleThemeButton.classList.remove("fa-sun-o");
            toggleThemeButton.classList.add("fa-moon-o");
        } else {
            toggleThemeButton.classList.remove("fa-moon-o");
            toggleThemeButton.classList.add("fa-sun-o");
        }

        document.querySelectorAll("img.alternate").forEach(function (node) {
            if (node.style.display === "none") {
                node.style.display = "";
            } else {
                node.style.display = "none";
            }
        });

        darkTheme = !darkTheme;

        fetch("{{ base_path }}/config/dark_theme", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ dark_theme: darkTheme })
        });
    }

    // When going back, we need to refresh the page because the browser uses the cached version anyways
    function back() {
        sessionStorage.setItem("refresh", "true");
        window.history.back();
    }

    function home() {
        sessionStorage.setItem("refresh", "true");
        window.location = '{{ base_path }}/';
    }
</script>
